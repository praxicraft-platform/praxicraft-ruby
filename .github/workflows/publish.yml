name: Publish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "praxicraft.gemspec"
      - ".github/workflows/publish.yml"

concurrency:
  group: publish-rubygems
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rake test

  publish:
    needs: test
    if: |
      github.event_name == 'workflow_dispatch' || (
        github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !contains(github.event.head_commit.message, '[skip release]')
      )
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Auto-bump patch version and CHANGELOG
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          LATEST="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0.0')"
          RAW="${LATEST#v}"
          IFS=. read -r MAJOR MINOR PATCH <<<"$RAW"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          PATCH=$((PATCH + 1))
          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION}"
          NOTES="$(git log "${LATEST}..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null | sed '/^chore(release):/d' || true)"
          if [ -z "$NOTES" ]; then NOTES="- Maintenance release."; fi
          export VERSION NOTES
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          v, notes = os.environ["VERSION"], os.environ["NOTES"]
          ver = Path("lib/praxicraft/version.rb")
          ver.write_text(re.sub(r'VERSION = "[^"]*"', f'VERSION = "{v}"', ver.read_text()))
          cl = Path("CHANGELOG.md")
          body = cl.read_text() if cl.exists() else "# Changelog\n\n"
          prior = body[body.index("## "):] if "## " in body else ""
          cl.write_text(f"# Changelog\n\n## {v}\n\n{notes}\n\n{prior}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/praxicraft/version.rb CHANGELOG.md
          if ! git diff --cached --quiet; then
            # Local commit only — do not push to main (rules require PRs).
            # Pushing the annotated tag keeps this release commit reachable.
            git commit -m "chore(release): ${TAG}"
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
          } >> "$GITHUB_OUTPUT"
      - name: Create and push release tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then echo "Tag exists"; exit 0; fi
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
      - name: Build gem
        run: gem build praxicraft.gemspec
      - name: Publish to RubyGems
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEM_HOST_API_KEY:-}" ]; then
            echo "RUBYGEMS_API_KEY not set — gem attached to GitHub Release only."
            exit 0
          fi
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: ${GEM_HOST_API_KEY}\n" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push "praxicraft-${{ steps.version.outputs.version }}.gem"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            praxicraft-*.gem
